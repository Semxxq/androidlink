name: androidlink
description: AndroidLink — Your Android on your Mac
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Сеть ──────────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1
  # ── macOS UI ──────────────────────────────────────────────────────
  macos_ui: ^2.2.2
  # ── State ─────────────────────────────────────────────────────────
  # ── Android: SMS и звонки ─────────────────────────────────────────
  permission_handler: ^13.0.2
  # ── UI ────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  timeago: ^3.7.0

  # ── Утилиты ───────────────────────────────────────────────────────
  uuid: ^4.5.1
  logger: ^2.4.0
  path_provider: ^2.1.4
  file_picker: ^13.4.0
  rxdart: ^0.28.0
  equatable: ^2.0.7
  cryptography: ^2.7.0
  # ── QR-код ────────────────────────────────────────────────────────────
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  flutter_local_notifications: ^23.0.3
  desktop_drop: ^0.8.0
  cryptography_flutter: ^2.3.4
  intl: ^0.20.3
  macos_window_utils: ^1.9.1
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
