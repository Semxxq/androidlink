name: Build AndroidLink

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Android project (v2 embedding)
        run: flutter create --platforms=android . --project-name androidlink

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidLink.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create macOS project
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos . --project-name androidlink

      - name: Set macOS deployment target to 10.14.6
        run: |
          find macos -name "project.pbxproj" -exec \
            sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*/MACOSX_DEPLOYMENT_TARGET = 10.14.6/g' {} \;
          sed -i '' "s/platform :osx, .*/platform :osx, '10.14.6'/" macos/Podfile

      - name: Patch macOS entitlements (network server)
        run: |
          cat > macos/Runner/Release.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key><true/>
              <key>com.apple.security.network.server</key><true/>
              <key>com.apple.security.network.client</key><true/>
          </dict>
          </plist>
          EOF
          cat > macos/Runner/DebugProfile.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key><true/>
              <key>com.apple.security.cs.allow-jit</key><true/>
              <key>com.apple.security.network.server</key><true/>
              <key>com.apple.security.network.client</key><true/>
          </dict>
          </plist>
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r $GITHUB_WORKSPACE/AndroidLink-mac.zip androidlink.app

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidLink-mac.zip
          path: AndroidLink-mac.zip
          retention-days: 30
