name: Build AndroidLink

on:
  push:
    branches: [main]
  workflow_dispatch:  # можно запустить вручную

jobs:

  # ── Android APK ─────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLink.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ── macOS .app ───────────────────────────────────────────────────────────
  build-macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          zip -r AndroidLink-mac.zip androidlink.app
          mv AndroidLink-mac.zip $GITHUB_WORKSPACE/

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: AndroidLink-mac.zip
          path: AndroidLink-mac.zip
          retention-days: 30
